<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluaciones IA | AulaMind Enterprise</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/evaluation.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<h2>AulaMind</h2>
{% set active_menu = 'evaluation' %}
    {% include 'partials/sidebar_menu.html' %}
</aside>

<main class="main-content">

<header>
<h1>Motor de Evaluaciones IA</h1>
<p>Genera, administra y exporta evaluaciones.</p>
</header>

<section class="evaluation-card">
<h2>Nueva evaluación</h2>

<form id="evaluationForm">

<input id="asignatura" name="asignatura" placeholder="Asignatura" required>
<input id="curso" name="curso" placeholder="Curso" required>
<input id="unidad" name="unidad" placeholder="Unidad" required>
<input id="objetivo" name="objetivo" placeholder="OA" required>
<input id="tema" name="tema" placeholder="Tema" required>

<select id="tipo" name="tipo">
<option>Diagnóstica</option>
<option>Formativa</option>
<option>Sumativa</option>
<option>Control</option>
</select>

<input id="preguntas" name="preguntas" type="number" value="10">

<select id="dificultad" name="dificultad">
<option>Básica</option>
<option>Intermedia</option>
<option>Avanzada</option>
</select>

<button type="submit">Generar Evaluación</button>

</form>

</section>

<section id="resultSection" style="display:none">

<h2>Resultado</h2>

<div class="toolbar">

<button id="copyEvaluation">Copiar</button>

<button id="downloadWord">Word</button>

<button id="downloadPdf">PDF</button>

</div>

<pre id="evaluationResult"></pre>

</section>

<section class="history">

<h2>Historial de evaluaciones</h2>

<table id="historyTable">

<thead>

<tr>
<th>Fecha</th>
<th>Curso</th>
<th>Asignatura</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="historyBody">

</tbody>

</table>

</section>

<div id="loadingModal" style="display:none">
Generando...
</div>

<script>

window.EVALUATION_CONFIG={

generateUrl:"{{ url_for('evaluation.generate') }}",
historyUrl:"{{ url_for('evaluation.history') }}"

};

</script>

<script src="{{ url_for('static', filename='js/evaluation.js') }}"></script>

</main>

</div>

</body>
</html>
